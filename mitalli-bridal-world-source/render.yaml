services:
  - type: web
    name: mitalli-bridal-world
    runtime: python
    plan: free
    branch: main
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mitalli-bridal-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENV
        value: production
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false   # set this manually in the Render dashboard — do not commit a real password

databases:
  - name: mitalli-bridal-db
    plan: free
    databaseName: mitalli_bridal
    user: mitalli_admin
